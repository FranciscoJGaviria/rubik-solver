<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="470" viewBox="0 0 1850 470">
  <defs>
    <filter id="c4-shadow" x="-6%" y="-6%" width="114%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <filter id="c4-pill-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="c4-arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1.5 L 11 6 L 1 10.5 z" fill="#52606D"/>
    </marker>
    <marker id="c4-arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1.5 L 11 6 L 1 10.5 z" fill="#1D4ED8"/>
    </marker>
  </defs>
  <rect width="1850" height="470" fill="#FFFFFF"/>
  <rect x="25" y="20" width="1800" height="430" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="60" y="62" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0F172A">Key / Leyenda C4 — Containers (Level 2)</text>
  <line x1="60" y1="78" x2="1790" y2="78" stroke="#E2E8F0" stroke-width="1.5"/>
  <g id="node-key-node-0" filter="url(#c4-shadow)">
    <rect x="65.0" y="159.0" width="260.0" height="141.0" rx="24" fill="#08427B" stroke="#052E56" stroke-width="2.2"/>
    <circle cx="195.0" cy="139.0" r="28.0" fill="#08427B" stroke="#052E56" stroke-width="2.2"/>
    <text x="195.0" y="193.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Cuber</text>
    <text x="195.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#B8D8F8" text-anchor="middle">[Person]</text>
    <text x="195.0" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Kid or Adult user on Android</text>
    <text x="195.0" y="251.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">or iOS.</text>
  </g>
  <text x="195.0" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Kid or Adult user on Android or</text>
  <text x="195.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">iOS.</text>
  <g id="node-key-node-1" filter="url(#c4-shadow)">
    <rect x="353.3" y="125.0" width="260.0" height="165.0" rx="20" fill="#438DD5" stroke="#2E6295" stroke-width="2.5"/>
    <rect x="363.3" y="143.0" width="240.0" height="127.0" rx="8" fill="none" stroke="#2E6295" stroke-width="1.4" opacity="0.65"/>
    <line x1="461.3" y1="135.0" x2="505.3" y2="135.0" stroke="#E2F0FF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="483.3" cy="280.0" r="5.0" fill="#E2F0FF" opacity="0.8"/>
    <text x="483.3" y="169.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Mobile Host Container</text>
    <text x="483.3" y="188.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#E2F0FF" text-anchor="middle">[Android / iOS Host]</text>
    <text x="483.3" y="211.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Platform entry point mounting</text>
    <text x="483.3" y="227.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">the shared Compose UI.</text>
  </g>
  <text x="483.3" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Platform entry point mounting</text>
  <text x="483.3" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">the shared Compose UI.</text>
  <g id="node-key-node-2" filter="url(#c4-shadow)">
    <rect x="641.7" y="125.0" width="260.0" height="165.0" rx="10" fill="#438DD5" stroke="#2E6295" stroke-width="2.2"/>
    <text x="771.7" y="159.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Application Container</text>
    <text x="771.7" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#E2F0FF" text-anchor="middle">[KMP / Native Adapter]</text>
    <text x="771.7" y="201.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Shared KMP module or platform</text>
    <text x="771.7" y="217.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">camera adapter.</text>
  </g>
  <text x="771.7" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Shared KMP module or platform</text>
  <text x="771.7" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">camera adapter.</text>
  <g id="node-key-node-3" filter="url(#c4-shadow)">
    <path d="M 930.0 143.0 L 930.0 272.0 A 130.0 18.0 0 0 0 1190.0 272.0 L 1190.0 143.0 Z" fill="#438DD5" stroke="#2E6295" stroke-width="2.2"/>
    <ellipse cx="1060.0" cy="143.0" rx="130.0" ry="18.0" fill="#438DD5" stroke="#2E6295" stroke-width="2.2"/>
    <text x="1060.0" y="185.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Local Data Store</text>
    <text x="1060.0" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#E2F0FF" text-anchor="middle">[SQLDelight / Binary Cache]</text>
    <text x="1060.0" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">On-device relational database</text>
    <text x="1060.0" y="243.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">and pruning table files.</text>
  </g>
  <text x="1060.0" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">On-device relational database</text>
  <text x="1060.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">and pruning table files.</text>
  <rect x="1218.3" y="125" width="260.0" height="165" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2.2" stroke-dasharray="9,6"/>
  <text x="1236.3" y="254" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E293B">System Boundary</text>
  <text x="1236.3" y="274" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">[Software System]</text>
  <text x="1348.3" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Boundary of the Rubik Solver</text>
  <text x="1348.3" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">mobile application.</text>
  <path d="M 1521.7 205 L 1751.7 205" fill="none" stroke="#52606D" stroke-width="2.4" stroke-dasharray="7,5" marker-end="url(#c4-arrow)"/>
  <rect x="1541.7" y="153" width="190" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="1636.7" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Relationship</text>
  <text x="1636.7" y="187" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">[Port / Protocol]</text>
  <line x1="1636.6666666666665" y1="242" x2="1636.6666666666665" y2="278" stroke="#64748B" stroke-width="2.2" stroke-dasharray="5,4"/>
  <path d="M 1541.7 260 L 1626.7 260 A 10 10 0 0 1 1646.7 260 L 1731.7 260" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#c4-arrow)"/>
  <text x="1636.7" y="294" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">Salto de línea (Line Jump) en cruces</text>
  <text x="1636.7" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">In-process call or reactive Flow</text>
  <text x="1636.7" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">stream.</text>
</svg>
