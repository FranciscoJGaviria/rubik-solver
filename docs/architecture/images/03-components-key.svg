<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="470" viewBox="0 0 1850 470">
  <defs>
    <filter id="c4-shadow" x="-6%" y="-6%" width="114%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <filter id="c4-pill-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="c4-arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1.5 L 11 6 L 1 10.5 z" fill="#52606D"/>
    </marker>
    <marker id="c4-arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1.5 L 11 6 L 1 10.5 z" fill="#1D4ED8"/>
    </marker>
  </defs>
  <rect width="1850" height="470" fill="#FFFFFF"/>
  <rect x="25" y="20" width="1800" height="430" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="60" y="62" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0F172A">Key / Leyenda C4 — Components &amp; Onion Layers (Level 3)</text>
  <line x1="60" y1="78" x2="1790" y2="78" stroke="#E2E8F0" stroke-width="1.5"/>
  <g id="node-key-node-0" filter="url(#c4-shadow)">
    <rect x="65.0" y="125.0" width="260.0" height="165.0" rx="10" fill="#85BBF0" stroke="#5D82A8" stroke-width="2.2"/>
    <text x="195.0" y="159.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0B2545" text-anchor="middle">Component</text>
    <text x="195.0" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1D4E89" text-anchor="middle">[Presentation / App / Infra]</text>
    <text x="195.0" y="201.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0B2545" text-anchor="middle">UI screen, 3D engine, use case</text>
    <text x="195.0" y="217.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0B2545" text-anchor="middle">or infrastructure adapter.</text>
  </g>
  <text x="195.0" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">UI screen, 3D engine, use case</text>
  <text x="195.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">or infrastructure adapter.</text>
  <g id="node-key-node-1" filter="url(#c4-shadow)">
    <rect x="497.5" y="125.0" width="260.0" height="165.0" rx="10" fill="#6CA6E0" stroke="#3F73A8" stroke-width="2.2"/>
    <text x="627.5" y="159.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#081C35" text-anchor="middle">Domain Bounded Context</text>
    <text x="627.5" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#143A66" text-anchor="middle">[domain.&lt;context&gt;]</text>
    <text x="627.5" y="201.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#081C35" text-anchor="middle">Pure Kotlin DDD context with</text>
    <text x="627.5" y="217.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#081C35" text-anchor="middle">zero external dependencies.</text>
  </g>
  <text x="627.5" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Pure Kotlin DDD context with</text>
  <text x="627.5" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">zero external dependencies.</text>
  <rect x="930.0" y="125" width="260.0" height="165" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2.2" stroke-dasharray="9,6"/>
  <text x="948.0" y="254" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E293B">Onion Layer Boundary</text>
  <text x="948.0" y="274" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">[Gradle Module]</text>
  <text x="1060.0" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Enforces inward-only</text>
  <text x="1060.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">dependencies at compile time.</text>
  <path d="M 1377.5 205 L 1607.5 205" fill="none" stroke="#52606D" stroke-width="2.4" stroke-dasharray="7,5" marker-end="url(#c4-arrow)"/>
  <rect x="1397.5" y="153" width="190" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="1492.5" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Dependency / Call</text>
  <text x="1492.5" y="187" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">[Kotlin / Port]</text>
  <line x1="1492.5" y1="242" x2="1492.5" y2="278" stroke="#64748B" stroke-width="2.2" stroke-dasharray="5,4"/>
  <path d="M 1397.5 260 L 1482.5 260 A 10 10 0 0 1 1502.5 260 L 1587.5 260" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#c4-arrow)"/>
  <text x="1492.5" y="294" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">Salto de línea (Line Jump) en cruces</text>
  <text x="1492.5" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Always points inward toward the</text>
  <text x="1492.5" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Domain core.</text>
</svg>
