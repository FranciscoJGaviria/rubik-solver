      <text x="445.0" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Follows 3D guide &amp; lessons</text>
      <text x="445.0" y="460.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">[Touch Gestures / Visual UI]</text>
    </g>
    <g id="edge-label-2" filter="url(#c4-pill-shadow)">
      <rect x="1079.0" y="426.5" width="242.0" height="47.0" rx="7" fill="#FFFFFF" fill-opacity="0.96" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="1200.0" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Scans cube, solves &amp; practices</text>
      <text x="1200.0" y="460.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">[Touch Gestures / Notation]</text>
    </g>
    <g id="edge-label-3" filter="url(#c4-pill-shadow)">
      <rect x="1859.2" y="676.5" width="191.6" height="47.0" rx="7" fill="#FFFFFF" fill-opacity="0.96" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="1955.0" y="694.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Shows faces under guide</text>
      <text x="1955.0" y="710.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">[Optical Light]</text>
    </g>
    <g id="edge-label-4" filter="url(#c4-pill-shadow)">
      <rect x="848.4" y="911.5" width="213.2" height="47.0" rx="7" fill="#FFFFFF" fill-opacity="0.96" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="955.0" y="929.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Persists profiles &amp; tables</text>
      <text x="955.0" y="945.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">[SQLDelight / File I/O]</text>
    </g>
    <g id="edge-label-5" filter="url(#c4-pill-shadow)">
      <rect x="1342.0" y="911.5" width="206.0" height="47.0" rx="7" fill="#FFFFFF" fill-opacity="0.96" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="1445.0" y="929.0" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Captures live face frames</text>
      <text x="1445.0" y="945.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">[CameraX / AVFoundation]</text>
    </g>
  </g>
  <g id="c4-nodes">
  <g id="node-kid_learner" filter="url(#c4-shadow)">
    <rect x="340.0" y="174.0" width="350.0" height="161.0" rx="24" fill="#08427B" stroke="#052E56" stroke-width="2.2"/>
    <circle cx="515.0" cy="154.0" r="28.0" fill="#08427B" stroke="#052E56" stroke-width="2.2"/>
    <text x="515.0" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Kid Learner (6–12)</text>
    <text x="515.0" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#B8D8F8" text-anchor="middle">[Person]</text>
    <text x="515.0" y="250.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Uses visual step-by-step 3D guides and</text>
    <text x="515.0" y="266.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">kid-friendly tutor lessons with positive</text>
    <text x="515.0" y="283.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">reinforcement.</text>
  </g>
  <g id="node-adult_cuber" filter="url(#c4-shadow)">
    <rect x="1025.0" y="174.0" width="350.0" height="161.0" rx="24" fill="#08427B" stroke="#052E56" stroke-width="2.2"/>
    <circle cx="1200.0" cy="154.0" r="28.0" fill="#08427B" stroke="#052E56" stroke-width="2.2"/>
    <text x="1200.0" y="208.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Adult Beginner / Improver</text>
    <text x="1200.0" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#B8D8F8" text-anchor="middle">[Person]</text>
    <text x="1200.0" y="250.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Solves scrambled 2x2 and 3x3 cubes or</text>
    <text x="1200.0" y="266.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">learns Beginner, Ortega, CFOP and Roux</text>
    <text x="1200.0" y="283.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">methods.</text>
  </g>
  <g id="node-physical_cube" filter="url(#c4-shadow)">
    <rect x="1710.0" y="150.0" width="350.0" height="185.0" rx="10" fill="#999999" stroke="#6B6B6B" stroke-width="2.2"/>
    <text x="1885.0" y="184.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Physical Rubik&#x27;s Cube</text>
    <text x="1885.0" y="203.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#EDEDED" text-anchor="middle">[External Artifact: 2x2 / 3x3 Puzzle]</text>
    <text x="1885.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Real puzzle held by the user; scanned via</text>
    <text x="1885.0" y="242.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">the device camera and manipulated following</text>
    <text x="1885.0" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">the 3D guide.</text>
  </g>
  <g id="node-rubik_solver_app" filter="url(#c4-shadow)">
    <rect x="990.0" y="600.0" width="420.0" height="210.0" rx="10" fill="#1168BD" stroke="#0B4884" stroke-width="2.2"/>
    <text x="1200.0" y="634.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Rubik Solver App</text>
    <text x="1200.0" y="653.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#D0E6FF" text-anchor="middle">[Software System: Kotlin Multiplatform + Compose]</text>
    <text x="1200.0" y="676.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Scans or accepts manual cube states, validates</text>
    <text x="1200.0" y="692.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">invariants, animates 3D solutions, and teaches</text>
    <text x="1200.0" y="709.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">solving techniques.</text>
  </g>
  <g id="node-device_storage" filter="url(#c4-shadow)">
    <rect x="620.0" y="1070.0" width="380.0" height="185.0" rx="10" fill="#999999" stroke="#6B6B6B" stroke-width="2.2"/>
    <text x="810.0" y="1104.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Local Device Storage</text>
    <text x="810.0" y="1123.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#EDEDED" text-anchor="middle">[External System: App Sandbox File System]</text>
    <text x="810.0" y="1146.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Stores local Kid/Adult profiles, tutor mastery</text>
    <text x="810.0" y="1162.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">progress, solve history and cached solver</text>
    <text x="810.0" y="1179.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">pruning tables.</text>
  </g>
  <g id="node-device_camera" filter="url(#c4-shadow)">
    <rect x="1400.0" y="1070.0" width="380.0" height="185.0" rx="10" fill="#999999" stroke="#6B6B6B" stroke-width="2.2"/>
    <text x="1590.0" y="1104.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Device Camera Hardware</text>
    <text x="1590.0" y="1123.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#EDEDED" text-anchor="middle">[External System: OS Camera Sensor]</text>
    <text x="1590.0" y="1146.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Streams live frames of each cube face for</text>
    <text x="1590.0" y="1162.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">on-device CIELAB color classification; frames</text>
    <text x="1590.0" y="1179.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">are never stored.</text>
  </g>
  </g>
  <text x="50" y="1478" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748B">C4 Model Notation (Simon Brown - c4model.com) — Zero external network dependencies (NFR-1, NFR-2)</text>
</svg>
