<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
  <defs>
    <filter id="c4-shadow" x="-6%" y="-6%" width="114%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <filter id="c4-pill-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="c4-arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1.5 L 11 6 L 1 10.5 z" fill="#52606D"/>
    </marker>
    <marker id="c4-arrow-blue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1.5 L 11 6 L 1 10.5 z" fill="#1D4ED8"/>
    </marker>
  </defs>
  <rect width="2400" height="1500" fill="#FFFFFF"/>
  <g id="c4-header">
    <text x="50" y="48" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#0F172A">System Context Diagram (C4 Level 1) — Rubik Solver</text>
    <text x="50" y="76" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#475569">100% offline mobile application for scanning, solving and mastering 2x2 and 3x3 Rubik&#x27;s cubes</text>
    <line x1="50" y1="92" x2="2350" y2="92" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
  <g id="boundary-device_boundary">
    <rect x="520.0" y="500.0" width="1360.0" height="860.0" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="2.2" stroke-dasharray="9,6"/>
    <text x="542.0" y="1328.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E293B">User&#x27;s Mobile Device (Android 8.0+ / iOS 16+)</text>
    <text x="542.0" y="1347.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569">[Execution Environment — 100% Offline]</text>
  </g>
  <g id="c4-edges">
    <path id="edge-path-1" d="M 445.0 335.0 L 445.0 691.0 Q 445.0 705.0 459.0 705.0 L 990.0 705.0" fill="none" stroke="#52606D" stroke-width="2.2" stroke-dasharray="7,5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c4-arrow)"/>
    <circle cx="445.0" cy="335.0" r="3.2" fill="#52606D"/>
    <path id="edge-path-2" d="M 1200.0 335.0 L 1200.0 600.0" fill="none" stroke="#52606D" stroke-width="2.2" stroke-dasharray="7,5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c4-arrow)"/>
    <circle cx="1200.0" cy="335.0" r="3.2" fill="#52606D"/>
    <path id="edge-path-3" d="M 1955.0 335.0 L 1955.0 1148.5 Q 1955.0 1162.5 1941.0 1162.5 L 1780.0 1162.5" fill="none" stroke="#52606D" stroke-width="2.2" stroke-dasharray="7,5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c4-arrow)"/>
    <circle cx="1955.0" cy="335.0" r="3.2" fill="#52606D"/>
    <path id="edge-path-4" d="M 1116.0 810.0 L 1116.0 921.0 Q 1116.0 935.0 1102.0 935.0 L 824.0 935.0 Q 810.0 935.0 810.0 949.0 L 810.0 1070.0" fill="none" stroke="#52606D" stroke-width="2.2" stroke-dasharray="7,5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c4-arrow)"/>
    <circle cx="1116.0" cy="810.0" r="3.2" fill="#52606D"/>
    <path id="edge-path-5" d="M 1284.0 810.0 L 1284.0 921.0 Q 1284.0 935.0 1298.0 935.0 L 1576.0 935.0 Q 1590.0 935.0 1590.0 949.0 L 1590.0 1070.0" fill="none" stroke="#52606D" stroke-width="2.2" stroke-dasharray="7,5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c4-arrow)"/>
    <circle cx="1284.0" cy="810.0" r="3.2" fill="#52606D"/>
  </g>
  <g id="c4-edge-labels">
