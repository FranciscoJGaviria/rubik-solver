    <text x="195.0" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Human user (Kid Learner or</text>
    <text x="195.0" y="251.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Adult Cuber) interacting with</text>
    <text x="195.0" y="268.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">the app.</text>
  </g>
  <text x="195.0" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Human user (Kid Learner or Adult</text>
  <text x="195.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Cuber) interacting with the app.</text>
  <g id="node-key-node-1" filter="url(#c4-shadow)">
