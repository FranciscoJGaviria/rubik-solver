<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="470" viewBox="0 0 1850 470">
  <defs>
    <filter id="c4-shadow" x="-6%" y="-6%" width="114%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
