  </defs>
  <rect width="1850" height="470" fill="#FFFFFF"/>
  <rect x="25" y="20" width="1800" height="430" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="60" y="62" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0F172A">Key / Leyenda C4 — System Context (Level 1)</text>
  <line x1="60" y1="78" x2="1790" y2="78" stroke="#E2E8F0" stroke-width="1.5"/>
  <g id="node-key-node-0" filter="url(#c4-shadow)">
    <rect x="65.0" y="159.0" width="260.0" height="141.0" rx="24" fill="#08427B" stroke="#052E56" stroke-width="2.2"/>
