    <text x="541.0" y="159.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Rubik Solver App</text>
    <text x="541.0" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#D0E6FF" text-anchor="middle">[Software System]</text>
    <text x="541.0" y="201.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">The Kotlin Multiplatform</text>
    <text x="541.0" y="217.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">application in scope.</text>
  </g>
  <text x="541.0" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">The Kotlin Multiplatform</text>
  <text x="541.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">application in scope.</text>
  <g id="node-key-node-2" filter="url(#c4-shadow)">
    <rect x="757.0" y="125.0" width="260.0" height="165.0" rx="10" fill="#999999" stroke="#6B6B6B" stroke-width="2.2"/>
    <text x="887.0" y="159.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">External System / Artifact</text>
    <text x="887.0" y="178.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#EDEDED" text-anchor="middle">[External]</text>
    <text x="887.0" y="201.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Physical Rubik&#x27;s Cube, OS</text>
    <text x="887.0" y="217.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Camera Sensor and Local</text>
    <text x="887.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle">Sandbox Storage.</text>
  </g>
  <text x="887.0" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Physical Rubik&#x27;s Cube, OS Camera</text>
  <text x="887.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Sensor and Local Sandbox</text>
  <text x="887.0" y="369" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Storage.</text>
  <rect x="1103.0" y="125" width="260.0" height="165" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2.2" stroke-dasharray="9,6"/>
  <text x="1121.0" y="254" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1E293B">Device Boundary</text>
  <text x="1121.0" y="274" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">[Execution Environment]</text>
  <text x="1233.0" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">User&#x27;s mobile phone or tablet</text>
  <text x="1233.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">running 100% offline.</text>
  <path d="M 1464.0 205 L 1694.0 205" fill="none" stroke="#52606D" stroke-width="2.4" stroke-dasharray="7,5" marker-end="url(#c4-arrow)"/>
  <rect x="1484.0" y="153" width="190" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="1579.0" y="172" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">Relationship</text>
  <text x="1579.0" y="187" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">[Technology / Protocol]</text>
  <line x1="1579.0" y1="242" x2="1579.0" y2="278" stroke="#64748B" stroke-width="2.2" stroke-dasharray="5,4"/>
  <path d="M 1484.0 260 L 1569.0 260 A 10 10 0 0 1 1589.0 260 L 1674.0 260" fill="none" stroke="#52606D" stroke-width="2.2" marker-end="url(#c4-arrow)"/>
  <text x="1579.0" y="294" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">Salto de línea (Line Jump) en cruces</text>
  <text x="1579.0" y="335" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">Synchronous or streaming</text>
  <text x="1579.0" y="352" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle">interaction between elements.</text>
</svg>
