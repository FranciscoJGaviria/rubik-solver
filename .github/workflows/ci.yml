name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spec-traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify spec elegance and traceability
        run: python3 scripts/verify_spec_traceability.py

  lint-and-jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run ktlint, detekt, JVM + Konsist tests and Kover coverage gate
        run: ./gradlew ktlintCheck detekt jvmTest koverVerify --stacktrace

  ios-simulator-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run iOS Simulator tests
        run: ./gradlew iosSimulatorArm64Test --stacktrace
