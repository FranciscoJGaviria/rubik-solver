complexity:
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInInterfaces: 15
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignoreNumbers: ['-1', '0', '1', '2', '3', '4', '5', '6', '8', '9', '12', '24', '26', '54']
  WildcardImport:
    active: true
